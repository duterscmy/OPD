# Shared configuration for Top-K OPD experiments.
seed: 42

model_name_or_path: Qwen/Qwen2.5-Math-1.5B
teacher_model_name_or_path: Qwen/Qwen3-4B
trust_remote_code: true
dtype: bfloat16
attn_implementation: null

student_use_chat_template: false
student_enable_thinking: false
teacher_use_chat_template: true
teacher_enable_thinking: false

dataset_name: AI-MO/NuminaMath-1.5
dataset_split: train
dataset_adapter: math
max_train_examples: 3200
shuffle_dataset: true
system_prompt: "Please reason step by step, and put your final answer within \\boxed{}."
user_prompt_template: "{problem}"

max_length: 4096
max_prompt_length: 2048
auto_shrink_max_length: false

# Only full and esr are supported.
strategy: full
full_max_new_tokens: 3072
prefix_length: 200

temperature: 0.7
top_p: 1.0
top_k: 0
rollout_do_sample: true

# Rollout termination safety. Qwen2.5 uses <|endoftext|> as its native EOS,
# while Qwen3 uses <|im_end|>; stop on either token. A hard-truncated rollout
# is kept for diagnostics but receives zero OPD loss by default. For this math
# task, generation stops as soon as the completion contains its first complete,
# non-empty boxed answer. Post-generation trimming remains as a safety fallback.
# A teacher-preferred EOS is appended as a synthetic terminal boundary; this is
# logged separately and is never counted as a student-generated EOS.
rollout_include_teacher_eos: true
rollout_extra_eos_tokens:
  - "<|im_end|>"
rollout_truncate_after_boxed_answer: true
rollout_append_eos_after_boxed_answer: true
truncated_rollout_weight: 0.0
rollout_repetition_ngram_size: 4

# Behaviour monitoring is diagnostic only: it never changes sampling, labels,
# loss masks, or gradients. Existing rollout-length console lines and JSONL
# fields remain unchanged. Online probabilities reuse the existing student and
# teacher training forwards. The fixed probe captures one rollout once and
# evaluates the same prefixes every 25 optimizer steps.
behavior_monitor_enabled: true
# Null means once per gradient-accumulation cycle (approximately once per
# optimizer step); set an integer for a different diagnostic cadence.
behavior_monitor_every_n_loss_calls: null
# Keep the legacy rollout console block byte-for-byte compatible by default.
# Set true only if a compact [student behavior] line is also wanted.
behavior_console_enabled: false
behavior_probe_enabled: true
behavior_probe_every_n_steps: 25
behavior_probe_samples: 1
behavior_probe_max_length: 4096
behavior_marker_manifest_path: behavior_marker_manifest_rank{rank}.json
behavior_probe_set_path: behavior_probe_set_rank{rank}.json
behavior_probe_jsonl_path: behavior_probe_rank{rank}.jsonl
# To reuse exactly the same probe across experiments, point this at a copied
# behavior_probe_set_rank{rank}.json. Null captures a new probe in output_dir.
behavior_probe_input_path: null

# Prevent long rollouts from receiving more weight merely because they contain
# more tokens. Each sequence is token-averaged before the batch average.
loss_normalization: per_sequence

# Explicit loss route. No auto backend and no full-vocabulary backend.
loss_backend: adaptive_opd
opd_loss_mode: reverse_kl
minimum_aligned_chars: 1
rkl_advantage_clip: null

# Top-K supports. Both distributions are renormalized inside the selected support.
reverse_top_k: 16
forward_top_k: 16
overlap_top_k: 16

# Shared mixture/adaptive parameters.
mixture_forward_alpha: 0.5
adaptive_overlap_threshold: 0.65
adaptive_forward_lambda: 0.10

# Prune weighting: each low-overlap token reduces subsequent RKL weight by 0.01,
# with a floor of 0.5.
prune_overlap_threshold: 0.65
prune_w_drop: 0.01
prune_w_base: 0.5
prune_cumulative: true

output_dir: outputs/qwen25_math_15b_to_qwen3_4b_topk_base
max_steps: 200
learning_rate: 5.0e-5
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
save_steps: 25
logging_steps: 1
warmup_ratio: 0.03
warmup_steps: null
weight_decay: 0.0
lr_scheduler_type: constant
gradient_checkpointing: true
num_workers: 0
report_to: none
save_only_model: false
resume_from_checkpoint: null
# Restart explicitly for the EOS-safe runs; set a checkpoint path manually
# when an intentional resume is needed.
auto_resume: false

use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
lora_target_modules: all-linear

# Detailed debugging. With batch_size=1 these defaults log every training sample
# and every generated token. Set debug_every_n_loss_calls > 1 or
# debug_max_tokens_per_sample > 0 when the JSONL becomes too large.
debug_jsonl_enabled: true
debug_jsonl_path: token_debug_rank{rank}.jsonl
debug_every_n_loss_calls: 1
debug_samples_per_batch: 0
debug_max_tokens_per_sample: 0
debug_summary_every_n_loss_calls: 1
debug_print_rollouts: true
debug_print_samples: 1
debug_print_max_chars: 100000
